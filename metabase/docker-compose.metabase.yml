version: "3.8"

services:
  metabase:
    image: metabase/metabase:latest
    container_name: delish-metabase-bi
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Metabase Application DB (internal state)
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_OPTS: "-Xmx1024m -Duser.timezone=Asia/Amman"
      MB_JETTY_PORT: 3000
      MB_SITE_NAME: "Delish & Bake — Executive Analytics"
      MB_SITE_LOCALE: "ar"
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

volumes:
  metabase-data:
    name: delish-metabase-data
