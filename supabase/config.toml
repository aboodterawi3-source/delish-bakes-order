# Supabase CLI Configuration for Delish & Bake Order Management
# https://github.com/supabase/cli

project_id = "zmeijwtivmniqpwyxezk"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_role = "service_role"

[auth]
enabled = true
site_url = "https://delish-bakes-order.aboodterawi3.workers.dev"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
