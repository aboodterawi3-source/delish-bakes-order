name: Testcontainers Integration Suite

on:
  push:
    branches: [main, independent-production-prep]
  pull_request:
    branches: [main]

jobs:
  testcontainers-db:
    name: Docker Testcontainers Integration
    runs-on: ubuntu-latest

    services:
      # Native Docker daemon available on ubuntu-latest runners

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Docker Daemon
        run: docker --version && docker info

      - name: Run Testcontainers Suite
        run: node test/testcontainers-postgres.mjs
