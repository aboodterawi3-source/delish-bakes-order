name: Release Please (Automated Semantic Release & Changelog)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run Release Please
        uses: google-github-actions/release-please-action@a02a34c4d625f3be7cf733203e6ecb973a391a85 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
