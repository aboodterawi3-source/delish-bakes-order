name: Delish Production Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    name: Types, Lifecycle Tests & Production Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js (v24)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 🔍 Strict TypeScript Checking
        run: npx tsc --noEmit

      - name: 🧪 Quality Gate & Lifecycle Test Suites (J2, J3, J5, Acceptance, V6 Engine)
        run: npm test
        env:
          NODE_OPTIONS: "--experimental-strip-types"

      - name: 🏗️ Production Build Integrity
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://mock.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "mock_key"
